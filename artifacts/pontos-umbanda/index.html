<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Sem `maximum-scale`: bloquear o zoom é barrar quem precisa dele.
         Este app é lido cantando, em luz baixa, e boa parte de quem canta tem
         mais de cinquenta anos. A WCAG 1.4.4 pede que a página amplie até
         200%, e o motivo original de travar (evitar o zoom acidental do iOS ao
         focar um input) já não existe: o Safari só faz isso quando a fonte do
         campo é menor que 16px, e a daqui não é. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="Organize e acesse pontos de umbanda de forma rápida e offline" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pontos" />
    <title>Pontos de Umbanda</title>

    <!-- A PRÉVIA DO LINK, que é como este app circula.
         
         O canal deste produto é o link colado no grupo do terreiro. Sem estas
         tags, o WhatsApp mostrava a URL crua — e uma URL crua num grupo é o
         que ninguém abre.
         
         `og:url` e `og:image` NÃO estão aqui: precisam de URL absoluta, e o
         endereço público ainda não existe (ADR 0003). Eles são injetados no
         build a partir de `PONTOS_URL_APP` — ver `scripts/opengraph.ts`, que
         explica por que omitir é melhor que chutar um caminho relativo. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pontos de Umbanda" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Pontos de Umbanda" />
    <meta
      property="og:description"
      content="O acervo organizado por orixá, na ordem da gira. Funciona sem sinal."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- A FONTE VEM DAQUI, e não do Google.
         
         Cada abertura do app fazia duas requisições a fonts.googleapis.com e
         fonts.gstatic.com — entregando ao Google o IP de quem usa um app de
         Umbanda, o que é dado sensível de religião pela LGPD. A fonte agora é
         servida pelo próprio app (`@fontsource-variable/inter`, importada em
         `main.tsx`), e a CSP fecha `font-src` em 'self'. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
